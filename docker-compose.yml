services:
  # 1. 数据库服务
  postgres:
    image: pgvector/pgvector:pg16
    container_name: thinktank-postgres
    restart: always
    environment:
      POSTGRES_DB: thinktank_monitor
      POSTGRES_USER: thinktank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - thinktank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinktank -d thinktank_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. 缓存与队列
  redis:
    image: redis:7-alpine
    container_name: thinktank-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - thinktank-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. 对象存储
  minio:
    image: minio/minio:latest
    container_name: thinktank-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - thinktank-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. 后端 Web API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thinktank-backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - thinktank-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # 5. 异步任务执行器
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thinktank-celery-worker
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - thinktank-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=4

  # 6. 定时任务调度器
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thinktank-celery-beat
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - thinktank-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=INFO

  # 7. 前端用户界面
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    container_name: thinktank-frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - thinktank-network
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  thinktank-network:
    driver: bridge